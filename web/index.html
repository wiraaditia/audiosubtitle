<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAV → SRT</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#14171c;--mut:#5d6673;--line:#dfe3e8;--acc:#2f6fed;--acc2:#1f55c2;--ok:#16794a;--err:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#171b21;--fg:#e8ebef;--mut:#98a2b0;--line:#2a313b;--acc:#5b8cff;--acc2:#7ba0ff;--ok:#4cc38a;--err:#ff7b72}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:26px;margin:0}
.sub{color:var(--mut);margin:4px 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
#drop{border:2px dashed var(--line);border-radius:12px;padding:28px 12px;text-align:center;cursor:pointer;color:var(--mut)}
#drop.over,#drop:hover{border-color:var(--acc);color:var(--fg)}
#drop b{color:var(--fg)}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:4px}
select,input[type=number]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);min-width:130px}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--fg)}
button{font:inherit;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--acc);color:#fff;font-weight:600}
button:hover{background:var(--acc2)}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:16px}
.bar>div{height:100%;width:0;background:var(--acc);transition:width .2s}
#status{margin-top:8px;font-size:14px;color:var(--mut);min-height:21px}
#status.err{color:var(--err)}#status.ok{color:var(--ok)}
textarea{width:100%;min-height:260px;margin-top:12px;font:13px/1.5 ui-monospace,Consolas,monospace;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);resize:vertical}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.note{font-size:13px;color:var(--mut);margin-top:16px}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <header>
    <h1 data-i="title">WAV → SRT</h1>
    <label>
      <span data-i="ui">Tampilan</span>
      <select id="ui"><option value="id">Bahasa Indonesia</option><option value="en">English</option></select>
    </label>
  </header>
  <p class="sub" data-i="sub"></p>

  <div class="card">
    <div id="drop" tabindex="0">
      <div><b data-i="drop"></b></div>
      <div id="fname" style="margin-top:6px"></div>
    </div>
    <input id="file" type="file" accept="audio/*,video/mp4,.wav,.mp3,.m4a,.flac,.ogg" class="hidden">

    <div class="row">
      <label><span data-i="lang"></span>
        <select id="lang"><option value="" data-i="auto"></option><option value="indonesian" selected>Indonesia</option><option value="english">English</option></select>
      </label>
      <label><span data-i="chars"></span><input id="chars" type="number" min="20" max="80" value="42"></label>
    </div>

    <div class="actions">
      <button id="go" disabled data-i="start"></button>
      <button id="stop" class="sec hidden" data-i="cancel"></button>
    </div>
    <div class="bar"><div id="bar"></div></div>
    <div id="status"></div>
  </div>

  <div class="card hidden" id="out" style="margin-top:16px">
    <b data-i="result"></b>
    <textarea id="srt" spellcheck="false"></textarea>
    <div class="actions">
      <button id="dl" data-i="download"></button>
      <button id="copy" class="sec" data-i="copy"></button>
    </div>
  </div>

  <p class="note" data-i="note"></p>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
